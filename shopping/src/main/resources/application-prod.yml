spring:
  datasource:
    # 실무나 GCP VM 환경에 맞는 DB URL로 변경 가능 (현재는 H2 기준 예시)
    url: jdbc:h2:mem:prod_db;MODE=MySQL 
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate 
    show-sql: false

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_KEY}